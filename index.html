{
const f=document.getElementById('game');let pending=null;
const src=v=>new TextDecoder().decode(Uint8Array.from(atob(document.getElementById('g'+v).textContent.trim()),c=>c.charCodeAt(0)));
function load(v,set){pending=set||null;f.srcdoc=src(v);try{localStorage.setItem('bardown-view',v);}catch(e){}}

}
