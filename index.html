<script>
{
const f=document.getElementById('game');let pending=null;
const src=v=>new TextDecoder().decode(Uint8Array.from(atob(document.getElementById('g'+v).textContent.trim()),c=>c.charCodeAt(0)));
function load(v,set){pending=set||null;f.srcdoc=src(v);try{localStorage.setItem('bardown-view',v);}catch(e){}}
addEventListener('message',e=>{const d=e.data;if(!d||e.source!==f.contentWindow)return;
  if(d.bd==='view')load(d.v==='3d'?'3d':'2d',d.set);
  if(d.bd==='ready'){if(pending)f.contentWindow.postMessage({bd:'settings',set:pending},'*');pending=null;f.focus();}});
let start='2d';try{start=localStorage.getItem('bardown-view')||'2d';}catch(e){}
if(location.hash==='#3d')start='3d';if(location.hash==='#2d')start='2d';
load(start);
}
</script>
